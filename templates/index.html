<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A股回测系统</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app">
    <!-- 侧边导航 -->
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark"></span>
        <div>
          <div class="brand-name">A股回测</div>
          <div class="brand-sub">Backtest Studio</div>
        </div>
      </div>
      <nav class="nav">
        <button class="nav-item active" data-view="recommend">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          选股推荐
        </button>
        <button class="nav-item" data-view="backtest">
          <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="m7 14 4-4 4 3 5-6"/></svg>
          策略回测
        </button>
        <button class="nav-item" data-view="reports">
          <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h5"/></svg>
          报告
        </button>
      </nav>
      <div class="sidebar-footer">本地运行 · 数据源 AkShare</div>
    </aside>

    <!-- 主工作区 -->
    <main class="workspace">

      <!-- 选股推荐 -->
      <section class="view active" id="view-recommend">
        <header class="view-header">
          <h1>选股推荐</h1>
          <p class="view-desc">扫描全市场，多维度打分，输出当前行情的推荐股票。</p>
        </header>

        <div class="controls">
          <label class="field">
            <span>推荐模式</span>
            <select id="rec-mode">
              <option value="general">综合推荐</option>
              <option value="dip">超跌反弹 · 60日线</option>
              <option value="dip120">超跌反弹 · 120日半年线</option>
            </select>
          </label>
          <label class="field">
            <span>推荐数量</span>
            <input id="rec-top" type="number" value="10" min="1" max="50">
          </label>
          <label class="field">
            <span>推荐风格</span>
            <select id="rec-style">
              <option value="">自动判断</option>
              <option value="aggressive">进攻型</option>
              <option value="defensive">防守型</option>
              <option value="balanced">均衡型</option>
            </select>
          </label>
          <button id="rec-btn" class="btn-primary">开始扫描</button>
        </div>

        <div id="rec-status" class="status hidden"></div>
        <div id="rec-result" class="result hidden"></div>
      </section>

      <!-- 策略回测 -->
      <section class="view" id="view-backtest">
        <header class="view-header">
          <h1>策略回测</h1>
          <p class="view-desc">选择策略与股票，模拟 A股真实交易规则（T+1、涨跌停、手续费）验证历史表现。</p>
        </header>

        <div class="form-grid">
          <label class="field">
            <span>策略</span>
            <select id="bt-strategy"></select>
          </label>
          <label class="field">
            <span>股票代码</span>
            <input id="bt-code" placeholder="如 600519">
          </label>
          <label class="field">
            <span>起始日期</span>
            <input id="bt-start" type="date">
          </label>
          <label class="field">
            <span>结束日期</span>
            <input id="bt-end" type="date">
          </label>
          <label class="field">
            <span>初始资金</span>
            <input id="bt-cash" type="number" value="100000" step="10000">
          </label>
        </div>
        <button id="bt-btn" class="btn-primary">运行回测</button>

        <div id="bt-status" class="status hidden"></div>
        <div id="bt-result" class="result hidden"></div>
      </section>

      <!-- 报告 -->
      <section class="view" id="view-reports">
        <header class="view-header">
          <h1>报告</h1>
          <p class="view-desc">历史生成的回测与推荐报告，点击在新窗口查看。</p>
        </header>
        <button id="reports-refresh" class="btn-ghost">刷新列表</button>
        <div id="reports-list"></div>
      </section>

    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
